name: backend-tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          venv-path: backend/.venv
          activate-environment: true
          working-directory: backend
          enable-cache: auto
          restore-cache: true
          save-cache: auto
          python-version: "3.14"

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Run Ruff Check
        run: cd backend && uv run ruff check

      - name: Run Ruff Format
        run: cd backend && uv run ruff format

      - name: Type check
        run: cd backend && uv run ty check

      - name: Run tests
        run: cd backend && uv run pytest -v
