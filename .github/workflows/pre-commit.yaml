name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python (backend) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv and backend virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            backend/.venv/
          key: uv-${{ hashFiles('backend/uv.lock') }}-${{ runner.os }}

      - name: Install backend dependencies
        run: cd backend && uv sync

      # --- NextJS (frontend) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules/
          key: npm-${{ hashFiles('frontend/package-lock.json') }}-${{ runner.os }}

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # --- Exécuter pre-commit ---
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.0
