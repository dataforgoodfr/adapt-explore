services:
  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - ./database/postgres-init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      interval: 10s
      retries: 10
      test: 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      timeout: 2s
  admin:
    image: nocodb/nocodb:2026.10.1
    env_file: .env
    environment:
      NODE_ENV: production # required even in dev mode, "development" value throw an error
    ports:
      - 3333:3333
    depends_on:
      db:
        condition: service_healthy
